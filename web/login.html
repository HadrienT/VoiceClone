<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceClone — connexion</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f6fa; --panel: #fff; --text: #1d2130; --muted: #6b7185; --accent: #7c5cff; --danger: #e5484d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --panel: #181b24; --text: #e8eaf2; --muted: #9aa1b5; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    form { background: var(--panel); padding: 28px; border-radius: 14px; width: 100%; max-width: 340px;
      box-shadow: 0 8px 30px #0002; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 20px; } p { margin: 0; color: var(--muted); font-size: 13px; }
    input { padding: 10px 12px; border-radius: 8px; border: 1px solid #8884; background: transparent; color: inherit; font: inherit; }
    button { padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .err { color: var(--danger); min-height: 1.2em; font-size: 13px; }
  </style>
</head>
<body>
  <form id="f">
    <h1>🎙️ VoiceClone</h1>
    <p>Cette instance est protégée par un mot de passe (VOICECLONE_PASSWORD).</p>
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" autofocus required>
    <button>Se connecter</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }) });
      if (!r.ok) { err.textContent = "Mot de passe incorrect."; return; }
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
    });
  </script>
</body>
</html>
